<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page draw under the iPhone
         notch/Dynamic Island and Android's gesture-nav strip instead of
         leaving them blank; env(safe-area-inset-*) in index.css (topbar,
         bottom-nav, modal-backdrop) then pads real content back inside
         the safe area. Harmless no-op on browsers/devices without a
         notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link href="/src/index.css" rel="stylesheet" />
    <link href="/favicon.png" rel="icon" />
    <link href="/manifest.webmanifest" rel="manifest" />
    <link href="/icons/apple-touch-icon.png" rel="apple-touch-icon" />
    <meta name="theme-color" content="#6945e8" />
    <meta name="description" content="CampusOS — your digital campus: food ordering, events, clubs, services, marketplace and more." />
    <!-- iOS ignores the web manifest for install/standalone behavior, so its
         PWA affordances need these legacy meta tags spelled out separately. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CampusOS" />
    <title>Campus OS | Your Digital Campus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
