name: CI

# Pull Request -> Lint -> Typecheck -> Unit tests -> Build -> E2E (doc §95).
# Deploy steps are intentionally NOT included -- this repo doesn't push to
# any hosting target yet (see docs/ROADMAP.md). Add a deploy job once a
# Vercel/Cloudflare Pages project and its secrets exist.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# VITE_SUPABASE_URL/KEY here are placeholders, not real secrets. They exist
# only so `vite build` and the (network-mocked, see tests/helpers/) E2E
# suite have *something* to construct a Supabase client with -- no request
# with real data ever needs to succeed for CI to pass. If you want CI to
# build against a real staging project instead, replace these with
# `${{ secrets.VITE_SUPABASE_URL }}` / `${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}`.
env:
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-anon-key

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --coverage=false

      - name: Build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write placeholder .env
        run: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" > .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> .env

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (network-mocked, doc §86 critical order flow included)
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
