name: CI

# Pull Request -> Lint -> Typecheck -> Unit tests -> Build -> E2E (doc §95),
# plus a dry run of deploy.yml's own logic (see deploy-dry-run below). Real
# deploys are NOT included here on purpose -- they're .github/workflows/deploy.yml,
# a separate workflow gated on this one going green, so a lint/test failure
# can never itself trigger a deploy.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# VITE_SUPABASE_URL/KEY here are placeholders, not real secrets. They exist
# only so `vite build` and the (network-mocked, see tests/helpers/) E2E
# suite have *something* to construct a Supabase client with -- no request
# with real data ever needs to succeed for CI to pass. If you want CI to
# build against a real staging project instead, replace these with
# `${{ secrets.VITE_SUPABASE_URL }}` / `${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}`.
env:
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-anon-key

jobs:
  # Exercises the real `.github/workflows/deploy.yml` shell logic (migrations
  # + edge functions + Vercel build/deploy + bundle-hash verification, for
  # both staging and production) against fake secrets and mocked
  # supabase/vercel CLIs -- no network, no real credentials, ~1 minute. This
  # is what makes deploy.yml trustworthy before its 6 real secrets ever get
  # set: a change that breaks its shell logic (bad quoting, a function
  # falling out of every deploy group, a broken flag) fails here on every
  # push instead of only being discoverable during a real deploy. See
  # scripts/deploy-dry-run.mjs's header for exactly what is and isn't
  # covered.
  deploy-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dry-run the deploy pipeline
        run: node scripts/deploy-dry-run.mjs

  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --coverage=false

      - name: Build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write placeholder .env
        run: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" > .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> .env

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (network-mocked, doc §86 critical order flow included)
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
