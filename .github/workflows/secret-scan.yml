name: Secret scan

# Runs gitleaks against every push/PR diff, and separately against the
# *entire* git history once a week. Added 2026-08-18 after a local-
# credential-file exposure incident (see SECURITY.md) surfaced that nothing
# in CI was checking for this at all. A push/PR-scoped scan only catches
# newly introduced leaks; the scheduled full-history scan is what actually
# would have caught the pre-existing findings a manual `gitleaks git
# --log-opts="--all"` run turned up when this workflow was written (a
# publishable Supabase key committed years ago -- low severity by design,
# see SECURITY.md -- but the scan should have flagged it on its own).

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  diff-scan:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  full-history-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download gitleaks
        run: |
          curl -sL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git --log-opts="--all" -v --exit-code 1 .
