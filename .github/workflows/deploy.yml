name: Deploy

# CI/CD production automation (readiness-audit phase 3). Every deploy across
# all seven passes this month was a person running `supabase db push
# --linked` and `npx vercel --prod --yes` by hand -- see docs/ENVIRONMENTS.md
# and the readiness-audit ship log. This automates that: migrations + edge
# functions + frontend go to staging first, the live Playwright suite
# (tests/live/**, the environment-aware one -- see docs/ENVIRONMENTS.md
# "What's NOT duplicated" for why scripts/live-check-*.mjs is NOT used here,
# it's hardcoded to production) has to pass against the newly-deployed
# staging build, and only then does the same land on production, closing
# with a bundle-hash check against the live URL like the RBAC pass
# (commit ace4256) did by hand.
#
# Needs repo secrets this session couldn't set itself (no `gh` CLI
# available) -- see docs/DEPLOYMENT.md "CI/CD secrets" for the full list and
# how to generate each one. Like backup.yml/storage-backup.yml, every
# individual CLI call here (db push, functions deploy, vercel build/deploy)
# was exercised manually against the real projects while writing this, but
# the workflow as a whole has NOT run inside actual GitHub Actions -- run it
# once via workflow_dispatch after setting every secret, before trusting the
# on-merge trigger alone.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_staging_gate:
        description: "Skip the staging live-check gate (only if staging itself is down and you need a hotfix out)"
        type: boolean
        default: false

concurrency:
  group: campusos-deploy
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  STAGING_PROJECT_REF: qmfmziilgkktwnqoxakk
  PROD_PROJECT_REF: dzjzjlylsfpmymkcavrq
  # Repo variable (Settings -> Secrets and variables -> Actions -> Variables),
  # not a secret -- it's the public production URL. Unset today, so this
  # falls back to the current domain; a future domain cutover is just
  # setting this one variable, no workflow edit -- see docs/DOMAIN_CUTOVER.md.
  PROD_URL: ${{ vars.PROD_URL || 'https://campusos-amber.vercel.app' }}
  # _shared is a shared-code directory, not a deployable function; razorpay-webhook
  # is deployed separately below with --no-verify-jwt (see supabase/functions/README.md).
  #
  # Functions in this group all expect a real, signed-in caller's Supabase JWT
  # (forwarded Authorization header) -- print-file-cleanup's pg_net caller sends
  # the service-role key, which is itself a project-signed JWT, so it passes
  # gateway verification too. Deployed WITHOUT --no-verify-jwt (the default),
  # so Supabase's gateway rejects anything without a valid JWT before the
  # function code even runs.
  OTHER_FUNCTIONS: >-
    campus-assistant create-razorpay-order print-file-cleanup
    razorpay-refund system-health
  # Functions in this group are never called with a Supabase session JWT --
  # a signed-out browser (password reset, USN signup) or pg_net acting on a
  # DB trigger/cron job (send-email/send-push/send-sms/payment-reconciliation),
  # authenticated instead by a shared secret the function checks itself. Found
  # live 24 Aug (readiness-audit phase 04): this whole group was previously
  # folded into OTHER_FUNCTIONS above, which would have flipped verify_jwt back
  # on for all of them the first time this workflow ever actually deployed --
  # each function's own file header already says "deploy with --no-verify-jwt"
  # for exactly this reason, but nothing enforced it here.
  NO_VERIFY_JWT_FUNCTIONS: >-
    confirm-password-reset payment-reconciliation request-password-reset
    send-email send-push send-sms signup-with-usn

jobs:
  # workflow_run fires for every CI run regardless of outcome -- only ever
  # continue past this on an actual green run of CI that was itself
  # triggered by a push to master (not a pull_request run), or a manual
  # dispatch, which bypasses CI on purpose (e.g. re-running a deploy that
  # failed for infra reasons after CI already passed).
  gate:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - run: echo "Deploying ${{ github.event.workflow_run.head_sha || github.sha }}"

  # Fails fast with one clear reason per secret instead of a cryptic failure
  # 3-4 minutes into deploy-staging (or worse, mid-way through production).
  # See scripts/validate-deploy-secrets.mjs's own header for exactly what
  # "well-formed" does and doesn't check.
  validate-secrets:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate the 6 deploy secrets are present and well-formed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_E2E_ACCOUNTS: ${{ secrets.STAGING_E2E_ACCOUNTS }}
        run: node scripts/validate-deploy-secrets.mjs

  deploy-staging:
    needs: validate-secrets
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Push migrations to staging
        run: npx supabase db push --project-ref "$STAGING_PROJECT_REF" --yes

      - name: Deploy edge functions to staging
        run: |
          set -euo pipefail
          npx supabase functions deploy --project-ref "$STAGING_PROJECT_REF" --use-api --yes -- $OTHER_FUNCTIONS
          npx supabase functions deploy --project-ref "$STAGING_PROJECT_REF" --use-api --no-verify-jwt --yes -- $NO_VERIFY_JWT_FUNCTIONS
          npx supabase functions deploy razorpay-webhook --project-ref "$STAGING_PROJECT_REF" --use-api --no-verify-jwt --yes

      - name: Deploy frontend to Vercel (staging = Preview env) and re-alias campusos-staging.vercel.app
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm install -g vercel@latest
          # Preview env vars on the Vercel project already point at staging's
          # Supabase project -- see docs/ENVIRONMENTS.md "Vercel environments".
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          DEPLOY_URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          vercel alias set "$DEPLOY_URL" campusos-staging.vercel.app --token="$VERCEL_TOKEN"
          BUNDLE_JS=$(basename "$(ls .vercel/output/static/assets/index-*.js | head -1)")
          echo "bundle=$BUNDLE_JS" >> "$GITHUB_OUTPUT"

      - name: Verify campusos-staging.vercel.app is serving the new bundle
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS https://campusos-staging.vercel.app/ | grep -qF "${{ steps.deploy.outputs.bundle }}"; then
              echo "Confirmed live: ${{ steps.deploy.outputs.bundle }}"
              exit 0
            fi
            sleep 5
          done
          echo "campusos-staging.vercel.app never served ${{ steps.deploy.outputs.bundle }}" >&2
          exit 1

  staging-live-check:
    needs: deploy-staging
    if: ${{ github.event.inputs.skip_staging_gate != 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed staging test-account sessions
        env:
          VITE_SUPABASE_URL: https://qmfmziilgkktwnqoxakk.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_E2E_ACCOUNTS: ${{ secrets.STAGING_E2E_ACCOUNTS }}
        run: node scripts/ci-seed-staging-sessions.mjs

      - name: Write .env pointed at staging (tests/live/helpers derive their target from this)
        env:
          VITE_SUPABASE_URL: https://qmfmziilgkktwnqoxakk.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" > .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> .env

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Live-check gate -- Playwright suite against the freshly-deployed staging app
        env:
          LIVE_URL: https://campusos-staging.vercel.app
        run: npx playwright test --config=playwright.live.config.cjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-live-check-report
          path: playwright-report/
          retention-days: 7

  deploy-production:
    needs: [deploy-staging, staging-live-check]
    # always() so this still runs when staging-live-check was intentionally
    # skipped (skip_staging_gate) -- but not when it ran and failed, and not
    # when deploy-staging itself failed.
    if: >-
      always() &&
      needs.deploy-staging.result == 'success' &&
      (needs.staging-live-check.result == 'success' || needs.staging-live-check.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Push migrations to production
        run: npx supabase db push --project-ref "$PROD_PROJECT_REF" --yes

      - name: Deploy edge functions to production
        run: |
          set -euo pipefail
          npx supabase functions deploy --project-ref "$PROD_PROJECT_REF" --use-api --yes -- $OTHER_FUNCTIONS
          npx supabase functions deploy --project-ref "$PROD_PROJECT_REF" --use-api --no-verify-jwt --yes -- $NO_VERIFY_JWT_FUNCTIONS
          npx supabase functions deploy razorpay-webhook --project-ref "$PROD_PROJECT_REF" --use-api --no-verify-jwt --yes

      - name: Deploy frontend to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          BUNDLE_JS=$(basename "$(ls .vercel/output/static/assets/index-*.js | head -1)")
          echo "bundle=$BUNDLE_JS" >> "$GITHUB_OUTPUT"

      - name: Bundle-hash verification -- confirm production is actually serving what we just built
        # Same manual check the RBAC pass (ace4256) did by hand: curl the
        # live URL and confirm its content-hashed JS filename matches the
        # build that was just deployed, not a cached/older one.
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS "$PROD_URL/" | grep -qF "${{ steps.deploy.outputs.bundle }}"; then
              echo "Bundle hash verified live on production ($PROD_URL): ${{ steps.deploy.outputs.bundle }}"
              exit 0
            fi
            sleep 5
          done
          echo "$PROD_URL never served ${{ steps.deploy.outputs.bundle }}" >&2
          exit 1
